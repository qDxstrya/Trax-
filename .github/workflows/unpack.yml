name: Unpack Trax+

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find and unpack Trax+ source
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf unpacked
          mkdir unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SOURCE_DIR="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -n "$SOURCE_DIR" ]; then
            echo "Project folder found: $SOURCE_DIR"

            rsync -av \
              --exclude=".github/workflows/" \
              "$SOURCE_DIR/" ./
          else
            echo "No top-level project folder found; copying archive contents directly."

            rsync -av \
              --exclude=".github/workflows/" \
              unpacked/ ./
          fi

          rm -rf unpacked
          rm -f "$ZIP_FILE"

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack Trax+ source"
            git push
          fi
